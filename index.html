<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Defterim</title>
<meta name="theme-color" content="#4A6B5D">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#FAF9F6;--dot:#cfcac0;--ink:#2b2b2a;--mute:#8a867d;--acc:#4A6B5D;--acc2:#C86D51;--card:#fffdf9;--line:#e6e2d8;--hand:'Caveat','Patrick Hand',cursive;--sans:'Plus Jakarta Sans',Inter,system-ui,sans-serif}
[data-theme=dark]{--bg:#1E1E20;--dot:#3a3a3e;--ink:#ecebe6;--mute:#8f8e88;--acc:#7fae9a;--acc2:#e08a6e;--card:#26262a;--line:#38383d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--bg) radial-gradient(var(--dot) 1px,transparent 1.2px) 0 0/22px 22px;display:flex;transition:background-color .3s}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
nav{width:230px;padding:22px 16px;border-right:1px solid var(--line);background:color-mix(in srgb,var(--bg) 85%,transparent);display:flex;flex-direction:column;gap:4px;overflow:auto;padding-top:max(22px,env(safe-area-inset-top))}
nav h1{font-family:var(--hand);font-size:2.2rem;margin:0 0 12px;color:var(--acc)}
nav .n{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;text-align:left;width:100%}
nav .n.on{background:var(--acc);color:#fff}
nav .sub{font-size:.8rem;color:var(--mute);margin:14px 12px 4px}
nav .lnk{font-size:.88rem;padding:6px 12px;text-align:left;width:100%;border-radius:8px;color:var(--mute)}
nav .lnk:hover{background:var(--line)}
main{flex:1;overflow:auto;padding:28px clamp(16px,4vw,48px) 100px;padding-top:max(28px,env(safe-area-inset-top))}
.page{max-width:760px;margin:0 auto;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
@media(prefers-reduced-motion:reduce){.page{animation:none}}
h2{font-family:var(--hand);font-size:2.4rem;margin:0;line-height:1.1}
.head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.head .sp{flex:1}
.btn{padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card)}
.btn.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn.sm{padding:4px 10px;font-size:.85rem}
.moods{display:flex;gap:6px;margin:6px 0 16px;align-items:center;color:var(--mute);font-size:.85rem}
.moods button{font-size:1.4rem;opacity:.35;filter:grayscale(1);padding:2px 4px;transition:.2s}
.moods button.on{opacity:1;filter:none;transform:scale(1.2)}
ul.items{list-style:none;margin:0;padding:0}
.it{display:flex;align-items:center;gap:6px;padding:7px 2px;border-bottom:1px dashed var(--line);min-height:44px}
.sym{width:34px;height:34px;border-radius:8px;font-size:1.25rem;font-weight:600;color:var(--acc);flex:none}
.sym:hover{background:var(--line)}
.txt{flex:1;line-height:1.4;word-break:break-word}
.it.done .txt{text-decoration:line-through;opacity:.5}
.it.migrated .txt,.it.scheduled .txt{opacity:.5}
.it.pri .txt{font-weight:600}
.it.pri .txt::before{content:"★ ";color:var(--acc2)}
.it .act{opacity:.45;font-size:.95rem;padding:6px}
.it .act:hover,.it.pri .st{opacity:1}
.add{display:flex;gap:8px;margin-top:14px}
.add input,.field{flex:1;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);outline:0}
.add input:focus,.field:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.hint{font-size:.78rem;color:var(--mute);margin-top:8px}
.panel{background:var(--card);border:1px solid var(--acc2);border-radius:14px;padding:14px 16px;margin-bottom:16px}
.panel label{display:flex;gap:8px;padding:4px 0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:10px 0 24px}
.cal b{font-size:.75rem;color:var(--mute);text-align:center;font-weight:500}
.cal button{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:.9rem;position:relative}
.cal button.today{border-color:var(--acc);border-width:2px}
.cal button i{position:absolute;bottom:3px;left:0;right:0;font-style:normal;font-size:.7rem;color:var(--acc2)}
.tbl{overflow-x:auto;padding-bottom:6px}
.tbl table{border-collapse:collapse;font-size:.75rem}
.tbl td,.tbl th{padding:2px;text-align:center;font-weight:400}
.tbl th:first-child,.tbl td:first-child{text-align:left;padding-right:10px;position:sticky;left:0;background:var(--bg);white-space:nowrap;font-size:.85rem}
.tbl td button{width:24px;height:24px;border-radius:6px;border:1px solid var(--line);background:var(--card)}
.tbl td button.on{background:var(--acc);border-color:var(--acc)}
.card{display:flex;justify-content:space-between;align-items:center;width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:8px;text-align:left}
.res{padding:10px 0;border-bottom:1px dashed var(--line);cursor:pointer}.res small{color:var(--mute);display:block}
.empty{color:var(--mute);padding:20px 0}
.zen nav,.zen .bar{display:none}
.bar{display:none}
@media(max-width:760px){
 body{flex-direction:column-reverse}
 nav{width:100%;flex-direction:row;border:0;border-top:1px solid var(--line);padding:6px 6px max(6px,env(safe-area-inset-bottom));justify-content:space-around;overflow:visible}
 nav h1,nav .sub,nav .lnk{display:none}
 nav .n{flex-direction:column;gap:0;font-size:.68rem;padding:6px 4px;width:auto;flex:1;align-items:center}
 main{padding-bottom:30px}
}
</style>
</head>
<body>
<nav id="nav"></nav>
<main id="main"></main>
<script>
/* ===== Veri katmanı ===== */
const KEY='defterim-v1';
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[a,b,c]=s.split('-');return new Date(+a,b-1,+c)};
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=s=>document.querySelector(s);
const TODAY=ymd(new Date());
const AYLAR=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const GUNLER=['Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi','Pazar'];
const SYM={task:'•',done:'✕',migrated:'>',scheduled:'<',event:'○',note:'–'};
const AD={task:'Görev',done:'Tamamlandı',migrated:'Ertelendi',scheduled:'Planlandı',event:'Etkinlik',note:'Not'};
const ORDER=Object.keys(SYM);
const MOODS=['😞','😕','😐','🙂','😄'];

function seed(){
  const it=(t,s='task',p=false)=>({id:uid(),t,s,p});
  return{theme:'light',zen:false,dismiss:'',
    days:{[TODAY]:{mood:null,items:[it('Defterime hoş geldin! Soldaki simgeye dokunarak durumu değiştir'),it('Önemli bir görev','task',true),it('Akşam 19:00 – arkadaşla buluşma','event'),it('Güzel bir gün: kısa notlar buraya','note')]}},
    cols:[{id:uid(),name:'Okuma Listesi',items:[it('Sefiller – Victor Hugo'),it('Küçük Prens','done'),it('Simyacı')]}],
    habits:[{id:'h1',name:'Kitap okuma'},{id:'h2',name:'Spor'},{id:'h3',name:'Su içme'}],hlog:{}};
}
function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return seed()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert('Kayıt yapılamadı: depolama dolu olabilir.')}}
let S=load();
let V={view:'day',date:TODAY,month:TODAY.slice(0,7),col:null,q:''};
const day=d=>S.days[d]||(S.days[d]={mood:null,items:[]});
const col=()=>S.cols.find(c=>c.id===V.col);
const list=sc=>sc==='col'?col().items:day(V.date).items;

/* ===== Ortak: madde listesi ===== */
function itemsHTML(items,sc){
  if(!items.length)return'<p class="empty">Henüz madde yok. Aşağıdan ilk maddeni ekle.</p>';
  return'<ul class="items">'+items.map(i=>`<li class="it ${i.s} ${i.p?'pri':''}" data-id="${i.id}" data-sc="${sc}">
   <button class="sym" data-a="cyc" title="${AD[i.s]} – değiştirmek için dokun" aria-label="${AD[i.s]}">${SYM[i.s]}</button>
   <span class="txt">${esc(i.t)}</span>
   <button class="act" data-a="star" title="Öncelikli" aria-label="Öncelik">${i.p?'★':'☆'}</button>
   <button class="act" data-a="edit" title="Düzenle" aria-label="Düzenle">✎</button>
   <button class="act" data-a="del" title="Sil" aria-label="Sil">🗑</button></li>`).join('')+'</ul>';
}
function addHTML(sc){return`<form class="add" data-sc="${sc}"><input name="t" placeholder="Yeni madde yaz…" autocomplete="off" aria-label="Yeni madde"><button class="btn pri">Ekle</button></form>
 <p class="hint">Kısayol: <b>o </b>etkinlik · <b>- </b>not · <b>* </b>öncelikli · yazmazsan görev olur</p>`}

/* ===== Görünümler ===== */
function dayView(){
  const d=parse(V.date),dd=day(V.date),isT=V.date===TODAY;
  const gun=GUNLER[(d.getDay()+6)%7];
  return`<div class="page"><div class="head">
   <button class="btn sm" data-a="dprev" aria-label="Önceki gün">‹</button>
   <h2>${d.getDate()} ${AYLAR[d.getMonth()]} ${d.getFullYear()}, ${gun}</h2>
   <button class="btn sm" data-a="dnext" aria-label="Sonraki gün">›</button><span class="sp"></span>
   ${isT?'':'<button class="btn sm" data-a="dtoday">Bugün</button>'}
   <button class="btn sm" data-a="zen">${S.zen?'Odak modundan çık':'Odak modu'}</button></div>
   <div class="moods">Ruh halim: ${MOODS.map((m,i)=>`<button data-a="mood" data-v="${i}" class="${dd.mood===i?'on':''}" aria-label="Ruh hali ${i+1}">${m}</button>`).join('')}</div>
   ${isT?migPanel():''}${itemsHTML(dd.items,'day')}${addHTML('day')}</div>`;
}
/* Akıllı taşıma: bugünden önceki en yakın günde tamamlanmamış görev varsa sor */
function migPanel(){
  if(S.dismiss===TODAY)return'';
  const prev=Object.keys(S.days).filter(k=>k<TODAY).sort().reverse().find(k=>S.days[k].items.some(i=>i.s==='task'));
  if(!prev)return'';
  const t=S.days[prev].items.filter(i=>i.s==='task');
  return`<div class="panel"><b>Dünden tamamlanmayan ${t.length} görev var.</b> Bugüne taşımak ister misin?
   <div style="margin:8px 0" id="mig" data-prev="${prev}">${t.map(i=>`<label><input type="checkbox" value="${i.id}" checked> ${esc(i.t)}</label>`).join('')}</div>
   <button class="btn pri sm" data-a="migyes">Seçilenleri taşı</button> <button class="btn sm" data-a="migno">Vazgeç</button></div>`;
}
function monthView(){
  const[y,m]=V.month.split('-').map(Number),n=new Date(y,m,0).getDate(),off=(new Date(y,m-1,1).getDay()+6)%7;
  const hl=(S.hlog[V.month]=S.hlog[V.month]||{});
  let cal=['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'].map(x=>`<b>${x}</b>`).join('')+'<span></span>'.repeat(off);
  for(let i=1;i<=n;i++){const k=`${V.month}-${pad(i)}`,dd=S.days[k],c=dd?dd.items.length:0;
    cal+=`<button data-a="goday" data-v="${k}" class="${k===TODAY?'today':''}">${i}<i>${dd&&dd.mood!=null?MOODS[dd.mood]:(c?'•'.repeat(Math.min(c,3)):'')}</i></button>`}
  const nums=Array.from({length:n},(_,i)=>i+1);
  const rows=S.habits.map(h=>`<tr><td>${esc(h.name)} <button class="act" data-a="hdel" data-v="${h.id}" title="Alışkanlığı sil" style="opacity:.4">×</button></td>${nums.map(d=>`<td><button data-a="htog" data-h="${h.id}" data-v="${d}" class="${(hl[h.id]||[]).includes(d)?'on':''}" aria-label="${d}. gün"></button></td>`).join('')}</tr>`).join('');
  return`<div class="page"><div class="head"><button class="btn sm" data-a="mprev">‹</button><h2>${AYLAR[m-1]} ${y}</h2><button class="btn sm" data-a="mnext">›</button></div>
   <div class="cal">${cal}</div>
   <h2 style="font-size:1.9rem;margin-bottom:8px">Alışkanlık takibi</h2>
   <div class="tbl"><table><tr><th></th>${nums.map(d=>`<th>${d}</th>`).join('')}</tr>${rows}</table></div>
   <form class="add" data-sc="habit"><input name="t" placeholder="Yeni alışkanlık (ör. Meditasyon)" autocomplete="off"><button class="btn pri">Ekle</button></form></div>`;
}
function colsView(){
  if(V.col&&col()){const c=col();
    return`<div class="page"><div class="head"><button class="btn sm" data-a="colback">‹ Koleksiyonlar</button><h2>${esc(c.name)}</h2><span class="sp"></span>
     <button class="btn sm" data-a="colren">Adı değiştir</button><button class="btn sm" data-a="coldel">Sil</button></div>${itemsHTML(c.items,'col')}${addHTML('col')}</div>`}
  return`<div class="page"><div class="head"><h2>Koleksiyonlar</h2></div>
   ${S.cols.map(c=>`<button class="card" data-a="colopen" data-v="${c.id}"><span>${esc(c.name)}</span><small>${c.items.length} madde</small></button>`).join('')||'<p class="empty">Koleksiyon yok. Okunacak kitaplar, hedefler gibi kendi listeni oluştur.</p>'}
   <form class="add" data-sc="newcol"><input name="t" placeholder="Yeni koleksiyon adı (ör. İzlenecek Filmler)" autocomplete="off"><button class="btn pri">Oluştur</button></form></div>`;
}
function searchView(){
  const q=V.q.trim().toLowerCase(),r=[];
  if(q){
    Object.keys(S.days).sort().reverse().forEach(k=>S.days[k].items.forEach(i=>{if(i.t.toLowerCase().includes(q))r.push(`<div class="res" data-a="goday" data-v="${k}">${esc(i.t)}<small>Günlük · ${k.split('-').reverse().join('.')}</small></div>`)}));
    S.cols.forEach(c=>{if(c.name.toLowerCase().includes(q))r.push(`<div class="res" data-a="colopen" data-v="${c.id}">${esc(c.name)}<small>Koleksiyon</small></div>`);
      c.items.forEach(i=>{if(i.t.toLowerCase().includes(q))r.push(`<div class="res" data-a="colopen" data-v="${c.id}">${esc(i.t)}<small>Koleksiyon · ${esc(c.name)}</small></div>`)})});
  }
  return`<div class="page"><div class="head"><h2>Ara</h2></div><input class="field" id="q" style="width:100%" value="${esc(V.q)}" placeholder="Notlarda ve koleksiyonlarda ara…" autocomplete="off">
   <div id="res">${q?(r.join('')||'<p class="empty">Sonuç bulunamadı.</p>'):'<p class="empty">Aramak için yazmaya başla.</p>'}</div></div>`;
}
function setView(){
  return`<div class="page"><div class="head"><h2>Ayarlar</h2></div>
   <p><button class="btn" data-a="theme">${S.theme==='dark'?'☀️ Gündüz defterine geç':'🌙 Gece defterine geç'}</button></p>
   <p><button class="btn" data-a="export">Yedekle (JSON indir)</button> <label class="btn" style="display:inline-block;cursor:pointer">Geri yükle (JSON seç)<input type="file" id="imp" accept=".json,application/json" hidden></label></p>
   <p class="hint">Veriler yalnızca bu cihazın tarayıcısında saklanır. Tarayıcı verisini silmeden önce yedek almayı unutma.</p></div>`;
}

/* ===== İskelet ===== */
const NAV=[['day','📓','Günlük'],['month','🗓','Aylık'],['cols','📚','Koleksiyonlar'],['search','🔍','Ara'],['set','⚙️','Ayarlar']];
function render(keepFocus){
  document.documentElement.dataset.theme=S.theme;
  document.body.classList.toggle('zen',S.zen&&V.view==='day');
  $('#nav').innerHTML='<h1>Defterim</h1>'+NAV.map(([k,ic,l])=>`<button class="n ${V.view===k?'on':''}" data-a="nav" data-v="${k}"><span>${ic}</span>${l}</button>`).join('')
   +'<div class="sub">İçindekiler</div>'+S.cols.map(c=>`<button class="lnk" data-a="colopen" data-v="${c.id}">📑 ${esc(c.name)}</button>`).join('')
   +'<div class="sub">Son günler</div>'+Object.keys(S.days).sort().reverse().slice(0,6).map(k=>`<button class="lnk" data-a="goday" data-v="${k}">${k.split('-').reverse().slice(0,2).join('.')}</button>`).join('');
  $('#main').innerHTML={day:dayView,month:monthView,cols:colsView,search:searchView,set:setView}[V.view]();
  const q=$('#q');if(q&&keepFocus){q.focus();q.setSelectionRange(q.value.length,q.value.length)}
  const imp=$('#imp');if(imp)imp.onchange=importJSON;
}
function go(v,x){V.view=v;Object.assign(V,x||{});render()}
function findItem(el){const li=el.closest('.it');return[list(li.dataset.sc),li.dataset.id]}

/* ===== Olaylar ===== */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,v=b.dataset.v;
  const sh=n=>{const d=parse(V.date);d.setDate(d.getDate()+n);V.date=ymd(d);render()};
  const shm=n=>{const[y,m]=V.month.split('-').map(Number);const d=new Date(y,m-1+n,1);V.month=`${d.getFullYear()}-${pad(d.getMonth()+1)}`;render()};
  switch(a){
    case'nav':go(v,{col:null});break;
    case'goday':go('day',{date:v});break;
    case'dprev':sh(-1);break;case'dnext':sh(1);break;case'dtoday':V.date=TODAY;render();break;
    case'mprev':shm(-1);break;case'mnext':shm(1);break;
    case'zen':S.zen=!S.zen;save();render();break;
    case'mood':{const d=day(V.date);d.mood=d.mood==+v?null:+v;save();render();break}
    case'cyc':{const[l,id]=findItem(b),i=l.find(x=>x.id===id);i.s=ORDER[(ORDER.indexOf(i.s)+1)%ORDER.length];save();render();break}
    case'star':{const[l,id]=findItem(b),i=l.find(x=>x.id===id);i.p=!i.p;save();render();break}
    case'edit':{const[l,id]=findItem(b),i=l.find(x=>x.id===id),t=prompt('Maddeyi düzenle',i.t);if(t&&t.trim()){i.t=t.trim();save();render()}break}
    case'del':{const[l,id]=findItem(b);if(confirm('Bu madde silinsin mi?')){l.splice(l.findIndex(x=>x.id===id),1);save();render()}break}
    case'migyes':{const box=$('#mig'),prev=S.days[box.dataset.prev].items;
      box.querySelectorAll('input:checked').forEach(c=>{const o=prev.find(x=>x.id===c.value);if(o){o.s='migrated';day(TODAY).items.push({id:uid(),t:o.t,s:'task',p:o.p})}});
      S.dismiss=TODAY;save();render();break}
    case'migno':S.dismiss=TODAY;save();render();break;
    case'htog':{const hl=S.hlog[V.month]=S.hlog[V.month]||{},arr=hl[b.dataset.h]=hl[b.dataset.h]||[],d=+v,i=arr.indexOf(d);i<0?arr.push(d):arr.splice(i,1);save();render();break}
    case'hdel':if(confirm('Bu alışkanlık silinsin mi?')){S.habits=S.habits.filter(h=>h.id!==v);save();render()}break;
    case'colopen':go('cols',{col:v});break;
    case'colback':go('cols',{col:null});break;
    case'colren':{const c=col(),t=prompt('Koleksiyon adı',c.name);if(t&&t.trim()){c.name=t.trim();save();render()}break}
    case'coldel':if(confirm('Koleksiyon ve içindeki tüm maddeler silinsin mi?')){S.cols=S.cols.filter(c=>c.id!==V.col);V.col=null;save();render()}break;
    case'theme':S.theme=S.theme==='dark'?'light':'dark';save();render();break;
    case'export':{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download=`defterim-yedek-${TODAY}.json`;a.click();break}
  }
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('form.add');if(!f)return;e.preventDefault();
  let t=f.t.value.trim();if(!t)return;const sc=f.dataset.sc;
  if(sc==='habit'){S.habits.push({id:uid(),name:t})}
  else if(sc==='newcol'){const c={id:uid(),name:t,items:[]};S.cols.push(c);V.col=c.id}
  else{let s='task',p=false;
    if(/^o\s/i.test(t)){s='event';t=t.slice(2)}else if(/^-\s/.test(t)){s='note';t=t.slice(2)}else if(/^\*\s/.test(t)){p=true;t=t.slice(2)}
    list(sc).push({id:uid(),t:t.trim(),s,p})}
  save();render();const i=$('.add input');if(i&&sc!=='newcol')i.focus();
});
document.addEventListener('input',e=>{if(e.target.id==='q'){V.q=e.target.value;render(true)}});
/* Klavye: Esc ile odak modundan çık, Alt+←/→ ile gün değiştir */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&S.zen){S.zen=false;save();render()}
  if(e.altKey&&V.view==='day'&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){const d=parse(V.date);d.setDate(d.getDate()+(e.key==='ArrowLeft'?-1:1));V.date=ymd(d);render()}
});
function importJSON(e){
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.days||!d.cols)throw 0;if(confirm('Mevcut veriler yedekle değiştirilsin mi?')){S=d;save();render();alert('Yedek geri yüklendi.')}}catch(x){alert('Geçersiz yedek dosyası.')}};
  r.readAsText(f);
}
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script>
</body>
</html>
